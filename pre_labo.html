    <script>
        function prelist() {
            var list, ls, i;
            //ここはpyでまとめたlistになる
            list = [
                ["てすと", "7", "12", "ファイル整理", "未"],
                ["菅野", "7", "12", "スクリプト制作", "未"]
            ];


            //送信後のコントロールは、pythonのFlaskモジュール

            //あまりにも見た目が悪い
            //送信後　未->完　に書き換え
            //未、完 色が分かれてた方がいいかな
            //サイズも表示されるようにしよう
            //年書いて、現在より１年経過してたら表示しないようにとか、あり
            //送信時間書く？
            //ファイルが選択されていなければ送信されないように
            ls = "";
            for (i = 0; i < list.length; i++) {
                ls = ls + list[i][0] + "　課題:" + list[i][3] +
                    "　期限" + list[i][1] + "月" + list[i][2] + "日 " +
                    '<form id="the-form" method="POST">' +
                    '<input type="file" id="file" name="file" multiple />' +
                    '<input type="submit" class="btn btn-primary  ml-2" id="submit" value="upload">' +
                    '<button class="btn btn-primary ml-2">Download</button>' +
                    '<button class="btn btn-primary ml-2">' + list[i][4] + '</button>' +
                    '</form> <br>';
            }

            document.getElementById("homeworklist").innerHTML = ls;
        }

                    "<font color='blue'>to  </font>" + 'Server:' +

                    '<input type="file" id="file" name="file" multiple />' +
                    '<input type="submit" class="btn btn-primary  ml-2" id="submit" value="upload">' +
                    '</form> <br>';
            }

            document.getElementById("homeworklist1").innerHTML = ls;
