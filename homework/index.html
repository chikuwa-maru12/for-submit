<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <title>web file</title>
</head>

<body>
    <div class="header">
        <h2>Web file manager</h2>
        <form method="post" id="uploadForm" enctype="multipart/form-data">
            <input type="file" name="files" id="fileInput" multiple>
            <button type="submit">送信</button>
        </form>

        <!--<button onclick="createFolder()">新規フォルダ</button>-->
    </div>

    <div id="path">/</div>

    <table id="fileList">
        <thead>
            <tr>
                <th>名前</th>
                <th>種類</th>
                <th>サイズ</th>
                <th>更新日</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="script.js" defer></script>
</body>

</html>
